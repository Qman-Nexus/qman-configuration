---
- name: Preview Qman OpenSSH security baseline
  hosts: nonproduction
  gather_facts: false
  become: false
  check_mode: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Verify approved execution boundary
      ansible.builtin.assert:
        that:
          - inventory_hostname == "qman-02"
          - qman_environment == "nonproduction"
          - ansible_check_mode

  roles:
    - ssh_hardening
